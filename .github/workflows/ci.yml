name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: >-
          python -m pip install
          pybind11 ruff gymnasium
          -r requirements-visualization.txt

      - name: Lint Python sources
        run: ruff check demos.py neattools.py demos tests

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMULTINEAT_BUILD_PYTHON=ON
          -DBUILD_TESTING=ON
          -DMULTINEAT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install smoke test
        run: cmake --install build --config Release --prefix install

      - name: Build installed-package consumer
        run: >-
          cmake -S tests/package_consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Link installed-package consumer
        run: cmake --build consumer-build --config Release --parallel 2

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMULTINEAT_BUILD_PYTHON=OFF
          -DMULTINEAT_BUILD_DEMO=OFF
          -DBUILD_TESTING=ON
          -DMULTINEAT_WARNINGS_AS_ERRORS=ON
          -DMULTINEAT_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel 2

      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure
