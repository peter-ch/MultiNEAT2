name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install build dependencies
        run: >-
          python -m pip install
          pybind11 ruff gymnasium
          -r requirements-visualization.txt

      - name: Lint Python sources
        run: ruff check demos.py neattools.py demos tests

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMULTINEAT_BUILD_PYTHON=ON
          -DBUILD_TESTING=ON
          -DMULTINEAT_WARNINGS_AS_ERRORS=ON
          -DPython3_EXECUTABLE=${{ env.pythonLocation }}/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python' }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Launcher self-test
        if: runner.os == 'Linux'
        run: python demos.py --self-test

      - name: Install smoke test
        run: cmake --install build --config Release --prefix install

      - name: Build installed-package consumer
        run: >-
          cmake -S tests/package_consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Link installed-package consumer
        run: cmake --build consumer-build --config Release --parallel 4

      - name: Run installed-package consumer
        run: ctest --test-dir consumer-build -C Release --output-on-failure

      - name: Configure Windows shared library
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build-shared
          -DBUILD_SHARED_LIBS=ON
          -DMULTINEAT_BUILD_PYTHON=OFF
          -DMULTINEAT_WARNINGS_AS_ERRORS=ON

      - name: Build Windows shared library
        if: runner.os == 'Windows'
        run: cmake --build build-shared --config Release --parallel 4

      - name: Test Windows shared library
        if: runner.os == 'Windows'
        run: ctest --test-dir build-shared -C Release --output-on-failure

  physics-demos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install physics dependencies
        run: >-
          python -m pip install pybind11
          -r requirements-box2d.txt
          -r requirements-mujoco.txt
          -r requirements-visualization.txt

      - name: Build extension
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMULTINEAT_BUILD_DEMO=OFF
          cmake --build build --parallel 4

      - name: Box2D and MuJoCo demo smoke tests
        env:
          MUJOCO_GL: egl
        run: ctest --test-dir build --output-on-failure -R gymnasium_demos

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
          python -m pip install dist/*.whl

      - name: Import installed package
        working-directory: ${{ runner.temp }}
        run: python -c "import pymultineat, neattools; print(pymultineat.__version__)"

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMULTINEAT_BUILD_PYTHON=OFF
          -DMULTINEAT_BUILD_DEMO=OFF
          -DBUILD_TESTING=ON
          -DMULTINEAT_WARNINGS_AS_ERRORS=ON
          -DMULTINEAT_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel 4

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure
